[project]
name = "detector-api-wrapper"
version = "0.1.0"
description = "Internal library wrapping the Detector API across providers with sanitization, caching, and normalized results."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
